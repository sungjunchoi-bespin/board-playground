spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/conduit_dev
    username: conduit
    password: conduit
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

conduit:
  jwt:
    secret: dev-jwt-secret-32chars-minimum!!
    expiration: 7d
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.conduit: DEBUG
    org.springframework.security: DEBUG
