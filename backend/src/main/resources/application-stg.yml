spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/conduit_stg
    username: ${DB_USERNAME:conduit}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

conduit:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 7d
  cors:
    allowed-origins: ${CORS_ORIGIN:https://stg.conduit.example.com}

logging:
  level:
    com.conduit: INFO
