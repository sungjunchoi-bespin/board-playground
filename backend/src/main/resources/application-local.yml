spring:
  datasource:
    url: jdbc:h2:mem:conduit_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

conduit:
  jwt:
    secret: local-jwt-secret-32chars-minimum!!
    expiration: 7d
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

logging:
  level:
    com.conduit: DEBUG
